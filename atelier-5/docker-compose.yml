# Stack de l'atelier 5 : l'app, Redis et Prometheus.
#   docker compose up -d --build
# Le blue/green de l'atelier 4 est dans docker-compose.deploy.yml (utilisé par deploy/deploy.sh).

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "9090:9090"
    volumes:
      # prometheus.yml et alerts.yml
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - web
    networks:
      - backend

networks:
  backend:

volumes:
  redis-data:
  prometheus-data:
