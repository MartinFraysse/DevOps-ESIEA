name: CI
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: atelier-4

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer flake8
        run: flake8 .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('atelier-4/requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Installer les dépendances
        run: pip install -r requirements-dev.txt

      - name: Lancer les tests
        run: pytest -v --cov=app --cov-report=html --cov-report=term

      - name: Sauvegarder le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: atelier-4/htmlcov/

  build-and-push:
    needs: test
    # Seulement sur un push sur main : pas d'image publiée pour chaque pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Connexion à ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et push de l'image
        uses: docker/build-push-action@v7
        with:
          # working-directory ne marche pas pour les "uses", il faut donner le dossier
          context: atelier-4
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/martinfraysse/devops-web:${{ github.sha }}
            ghcr.io/martinfraysse/devops-web:latest

  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Environment GitHub : il faut une approbation avant que le déploiement parte
    environment: production
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      # Le runner est une machine neuve à chaque fois : pas d'état, pas d'image.
      # deploy.sh démarre redis + nginx et télécharge l'image du commit sur ghcr.io.
      - name: Déployer en blue/green
        run: ./deploy/deploy.sh "${{ github.sha }}"

      - name: Vérifier ce que nginx renvoie
        run: curl -s localhost:8080/status
